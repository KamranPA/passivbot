name: passivbot-backtest-windows

# Runs one backtest per time window (matrix) using the code in THIS repository,
# then a summary job aggregates all windows into one table (see the run's Summary tab).
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file in this repo (compare my_config.json vs my_config_safe.json)"
        default: "configs/my_config_safe.json"
      start_date:
        description: "Overall start (YYYY-MM-DD)"
        default: "2026-01-01"
      end_date:
        description: "Overall end (YYYY-MM-DD or now)"
        default: "now"
      window_months:
        description: "Length of each window in months"
        default: "3"
      exchanges:
        description: "Data exchanges, comma-separated"
        default: "okx"
      coins:
        description: "Optional: limit coins, comma-separated (e.g. BTC,ETH,SOL). Empty = config as is"
        default: ""
      n_positions:
        description: "Max simultaneous open positions (long). Empty = config as is"
        default: ""
      twe:
        description: "total_wallet_exposure_limit (long), e.g. 1 or 0.8. Empty = config as is"
        default: ""
      hsl:
        description: "Equity hard-stop on long side: true / false. Empty = config as is"
        default: ""
      label:
        description: "Name tag added to result file names (e.g. base, hsl-twe1)"
        default: "run"

permissions:
  contents: read

env:
  STARTING_BALANCE: "1000"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.mk.outputs.windows }}
    steps:
      - id: mk
        env:
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
          MONTHS: ${{ inputs.window_months }}
        run: |
          python3 - <<'PY'
          import os, json, calendar, datetime as dt

          def add_months(d, n):
              y = d.year + (d.month - 1 + n) // 12
              m = (d.month - 1 + n) % 12 + 1
              return dt.date(y, m, min(d.day, calendar.monthrange(y, m)[1]))

          start = dt.date.fromisoformat(os.environ["START"])
          end_s = os.environ["END"].strip().lower()
          end = dt.date.today() if end_s == "now" else dt.date.fromisoformat(end_s)
          n = max(1, int(os.environ["MONTHS"]))

          wins, cur = [], start
          while cur < end and len(wins) < 60:
              nxt = min(add_months(cur, n), end)
              wins.append({"start": cur.isoformat(), "end": nxt.isoformat()})
              cur = nxt
          print(json.dumps(wins, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("windows=" + json.dumps(wins) + "\n")
          PY

  backtest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        window: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Passivbot from this repository (full profile)
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip maturin
          python -m pip install -e ".[full]"
          echo "Passivbot commit: $(git rev-parse HEAD)"

      - name: Set balance, dates, exchanges in config
        env:
          CONFIG: ${{ inputs.config }}
          START: ${{ matrix.window.start }}
          END: ${{ matrix.window.end }}
          EXCHANGES: ${{ inputs.exchanges }}
          COINS: ${{ inputs.coins }}
          NPOS: ${{ inputs.n_positions }}
          TWE: ${{ inputs.twe }}
          HSL: ${{ inputs.hsl }}
        run: |
          python - <<'PY'
          import json, os
          c = json.load(open(os.environ["CONFIG"]))
          b = c.setdefault("backtest", {})
          b["starting_balance"] = float(os.environ["STARTING_BALANCE"])
          b["start_date"] = os.environ["START"]
          b["end_date"] = os.environ["END"]
          b["exchanges"] = [x.strip() for x in os.environ["EXCHANGES"].split(",") if x.strip()]
          b["suite_enabled"] = False
          coins = [x.strip().upper() for x in os.environ["COINS"].split(",") if x.strip()]
          if coins:
              c.setdefault("live", {})["approved_coins"] = {"long": coins, "short": []}
          npos = os.environ.get("NPOS", "").strip()
          if npos:
              c["bot"]["long"]["risk"]["n_positions"] = float(npos)
          twe = os.environ.get("TWE", "").strip()
          if twe:
              c["bot"]["long"]["risk"]["total_wallet_exposure_limit"] = float(twe)
          hsl = os.environ.get("HSL", "").strip().lower()
          if hsl in ("true", "false"):
              c["bot"]["long"]["hsl"]["enabled"] = (hsl == "true")
          json.dump(c, open("/tmp/bt_config.json", "w"), indent=2)
          print(json.dumps({k: b[k] for k in ("starting_balance","start_date","end_date","exchanges")}))
          L = c["bot"]["long"]
          print("config:", os.environ["CONFIG"],
                "| long n_positions =", L["risk"]["n_positions"],
                "| TWE =", L["risk"]["total_wallet_exposure_limit"],
                "| hsl enabled =", L["hsl"]["enabled"],
                "| hsl red_threshold =", L["hsl"]["red_threshold"])
          PY

      - name: Run backtest (stops before the job limit so results can be uploaded)
        run: |
          timeout --signal=SIGINT 20000 passivbot backtest /tmp/bt_config.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.label }}-${{ matrix.window.start }}_${{ matrix.window.end }}
          path: |
            backtests/
            logs/
          retention-days: 14
          if-no-files-found: ignore

  summary:
    needs: backtest
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: backtest-${{ inputs.label }}-*
          path: results

      - name: Aggregate windows
        run: |
          python3 scripts/aggregate_backtests.py results --out summary.md || true
          cat summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ inputs.label }}
          path: summary.md
          retention-days: 30
          if-no-files-found: ignore
