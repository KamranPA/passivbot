name: passivbot-live

on:
  workflow_dispatch:        # manual start + self-relaunch
  schedule:
    - cron: "*/30 * * * *"  # safety net if the chain ever breaks

# Only one run at a time; a new run waits for the current one (never cancels it)
concurrency:
  group: passivbot-live
  cancel-in-progress: false

permissions:
  contents: read
  actions: write            # needed to relaunch this workflow

env:
  PB_VERSION: master        # must be >= config_version v8.6.0; pin a release tag once verified
  PB_USER: myuser           # name used in api-keys.json
  RUN_SECONDS: "20700"      # 5h45m

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4          # your repo: holds your config file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Get Passivbot
        run: |
          git clone --depth 1 --branch "$PB_VERSION" https://github.com/enarjord/passivbot.git ~/passivbot
          cd ~/passivbot
          python -m pip install -e .       # live-only profile (see docs/installation.md)

      - name: Write API keys (from Secrets)
        env:
          EXCHANGE: ${{ secrets.PB_EXCHANGE }}
          API_KEY: ${{ secrets.PB_API_KEY }}
          API_SECRET: ${{ secrets.PB_API_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          d = {os.environ["PB_USER"]: {
              "exchange": os.environ["EXCHANGE"],
              "key": os.environ["API_KEY"],
              "secret": os.environ["API_SECRET"]}}
          json.dump(d, open(os.path.expanduser("~/passivbot/api-keys.json"), "w"))
          PY

      - name: Run bot until time is up
        run: |
          cd ~/passivbot
          # VERIFY the exact CLI/config path in the docs for your version
          timeout --signal=SIGINT "$RUN_SECONDS" \
            passivbot live -u "$PB_USER" "$GITHUB_WORKSPACE/configs/my_config.json" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ~/passivbot/logs/
          retention-days: 3
          if-no-files-found: ignore

  relaunch:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Start next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run passivbot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
