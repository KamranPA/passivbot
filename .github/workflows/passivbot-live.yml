name: passivbot-live-okx

# Start manually from the Actions tab. Each run lasts ~5h45m, then starts the next one.
# No cron on purpose: cancelling the run (or disabling this workflow) really stops the chain.
on:
  workflow_dispatch:

concurrency:
  group: passivbot-live
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  PB_VERSION: master        # must be >= config_version v8.6.0; pin a release tag once verified
  PB_USER: okx_01           # account name; written into live.user of the config
  RUN_SECONDS: "20700"      # 5h45m

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Get Passivbot
        run: |
          git clone --depth 1 --branch "$PB_VERSION" https://github.com/enarjord/passivbot.git ~/passivbot
          cd ~/passivbot
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip maturin
          python -m pip install -e .
          CARGO=$(find . -name Cargo.toml -not -path "./.venv/*" -not -path "*/target/*" | head -n1)
          echo "Using $CARGO"
          maturin develop --release -m "$CARGO"

      - name: Write API keys (from Secrets)
        env:
          API_KEY: ${{ secrets.PB_API_KEY }}
          API_SECRET: ${{ secrets.PB_API_SECRET }}
          API_PASSPHRASE: ${{ secrets.PB_API_PASSPHRASE }}
        run: |
          python - <<'PY'
          import json, os
          d = {os.environ["PB_USER"]: {
              "exchange": "okx",
              "key": os.environ["API_KEY"],
              "secret": os.environ["API_SECRET"],
              "passphrase": os.environ["API_PASSPHRASE"]}}
          path = os.path.expanduser("~/passivbot/api-keys.json")
          with open(path, "w") as f:
              json.dump(d, f)
          os.chmod(path, 0o600)
          PY

      - name: Prepare live config
        run: |
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "configs/my_config.json")
          c = json.load(open(p))
          c.setdefault("live", {})["user"] = os.environ["PB_USER"]
          json.dump(c, open("/tmp/live_config.json", "w"), indent=2)
          r = c["bot"]["long"]["risk"]
          print("user:", c["live"]["user"], "| leverage:", c["live"].get("leverage"),
                "| n_positions:", r["n_positions"], "| TWE:", r["total_wallet_exposure_limit"],
                "| hsl enabled:", c["bot"]["long"]["hsl"]["enabled"])
          PY

      - name: Run bot until time is up
        run: |
          cd ~/passivbot
          # VERIFY the exact CLI for your version in the docs
          timeout --signal=SIGINT "$RUN_SECONDS" passivbot live /tmp/live_config.json || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ~/passivbot/logs/
          retention-days: 3
          if-no-files-found: ignore

  relaunch:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Start next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run passivbot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
